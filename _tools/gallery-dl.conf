{
  "extractor": {
    "base-directory": "./assets/instagram",
    "archive": "./_tools/ig-archive.sqlite",
    "skip": true,
    "sleep-request": [2.0, 5.0],
    "retries": 3,

    "instagram": {
      "directory": ["{username}", "{subcategory}"],
      "filename": "{date:%Y-%m-%d}_{shortcode}_{num:>02}.{extension}",
      "videos": true,
      "include": ["posts", "reels"],
      "cookies": "./_tools/instagram-cookies.txt"
    }
  },
  "output": {
    "mode": "auto",
    "progress": true
  },
  "downloader": {
    "http": { "rate": null }
  }
}
